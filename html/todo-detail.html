<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 待办事项详情</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>待办事项详情</h1>
            <p>查看任务详细信息</p>
        </div>
        
        <div class="form-container">
            <div class="detail-card">
                <div class="detail-header">
                    <h3>任务标题</h3>
                    <p id="todoTitle" style="font-size: 20px; font-weight: 700; color: #1e40af;">-</p>
                </div>
            </div>
            
            <div class="detail-card">
                <h3 class="section-title">任务信息</h3>
                <div class="detail-item">
                    <span>起始时间:</span>
                    <span id="todoStartDate">-</span>
                </div>
                <div class="detail-item">
                    <span>截止日期:</span>
                    <span id="todoDueDate">-</span>
                </div>
                <div class="detail-item">
                    <span>优先级:</span>
                    <span id="todoPriority">-</span>
                </div>
                <div class="detail-item">
                    <span>状态:</span>
                    <span id="todoStatus">-</span>
                </div>
            </div>
            
            <div class="detail-card">
                <h3 class="section-title">任务描述</h3>
                <div id="todoDescription" style="padding: 16px; background: #f9fafb; border-radius: 8px; color: #374151; line-height: 1.6;">-</div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">返回</button>
                <button class="btn btn-primary" onclick="editTodo()">修改任务</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        let currentIndex = -1;
        let currentTodo = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            currentIndex = parseInt(getUrlParam('id'));
            if (isNaN(currentIndex)) {
                alert('无效的待办事项ID');
                navigateTo('todo.html');
                return;
            }
            
            const todos = getTodos();
            if (currentIndex >= todos.length) {
                alert('待办事项不存在');
                navigateTo('todo.html');
                return;
            }
            
            currentTodo = todos[currentIndex];
            loadTodoDetail();
        });

        function loadTodoDetail() {
            document.getElementById('todoTitle').textContent = currentTodo.title;
            document.getElementById('todoStartDate').textContent = currentTodo.startDate ? formatDate(currentTodo.startDate) : '未设置';
            document.getElementById('todoDueDate').textContent = formatDate(currentTodo.dueDate);
            document.getElementById('todoPriority').textContent = getPriorityText(currentTodo.priority);
            document.getElementById('todoStatus').textContent = getStatusText(currentTodo.completed ? 'completed' : 'pending');
            document.getElementById('todoDescription').textContent = currentTodo.description || '无描述';
        }

        function goBack() {
            navigateTo('todo.html');
        }

        function editTodo() {
            navigateTo(`todo-edit.html?id=${currentIndex}`);
        }
    </script>
</body>
</html>
