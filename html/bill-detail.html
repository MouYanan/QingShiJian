<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 账单详情</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>账单详情</h1>
            <p>查看账单详细信息</p>
        </div>
        
        <div class="form-container">
            <div class="detail-card">
                <div class="detail-header">
                    <h3 id="dateTitle">日期</h3>
                    <p id="dateDisplay" style="font-size: 20px; font-weight: 700; color: #1e40af;">2024年1月1日</p>
                </div>
            </div>
            
            <div class="detail-card">
                <div class="detail-header">
                    <h3>总金额</h3>
                    <p id="totalAmount" style="font-size: 28px; font-weight: 700; color: #10b981;">¥0.00</p>
                </div>
            </div>
            
            <div class="detail-card">
                <h3 class="section-title">支出明细</h3>
                <div id="itemsList"></div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">返回</button>
                <button class="btn btn-primary" onclick="editBill()">修改账单</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        let currentIndex = -1;
        let currentBill = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            currentIndex = parseInt(getUrlParam('id'));
            if (isNaN(currentIndex)) {
                alert('无效的账单ID');
                navigateTo('index.html');
                return;
            }
            
            const bills = getBills();
            if (currentIndex >= bills.length) {
                alert('账单不存在');
                navigateTo('index.html');
                return;
            }
            
            currentBill = bills[currentIndex];
            loadBillDetail();
        });

        function loadBillDetail() {
            if (currentBill.type === 'project') {
                document.getElementById('dateTitle').textContent = '项目名称';
                document.getElementById('dateDisplay').textContent = currentBill.name;
            } else {
                document.getElementById('dateTitle').textContent = '账单日期';
                document.getElementById('dateDisplay').textContent = formatDate(currentBill.date);
            }
            
            document.getElementById('totalAmount').textContent = formatCurrency(currentBill.total);
            
            let itemsHTML = '';
            currentBill.expenses.forEach(expense => {
                if (currentBill.type === 'project') {
                    itemsHTML += `
                        <div class="detail-item">
                            <div style="display: flex; flex-direction: column;">
                                <span style="font-size: 12px; color: #6b7280;">${expense.date}</span>
                                <span>${expense.item}</span>
                            </div>
                            <span style="font-weight: 600;">${formatCurrency(expense.amount)}</span>
                        </div>
                    `;
                } else {
                    itemsHTML += `
                        <div class="detail-item">
                            <span>${expense.item}</span>
                            <span style="font-weight: 600;">${formatCurrency(expense.amount)}</span>
                        </div>
                    `;
                }
            });
            document.getElementById('itemsList').innerHTML = itemsHTML;
        }

        function goBack() {
            navigateTo('index.html');
        }

        function editBill() {
            navigateTo(`bill-edit.html?id=${currentIndex}`);
        }
    </script>
</body>
</html>
