<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 生日详情</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>生日详情</h1>
            <p>查看生日详细信息</p>
        </div>
        
        <div class="form-container">
            <div class="detail-card">
                <div class="detail-header">
                    <h3>姓名</h3>
                    <p id="birthdayName" style="font-size: 20px; font-weight: 700; color: #1e40af;">-</p>
                </div>
            </div>
            
            <div class="detail-card">
                <h3 class="section-title">生日信息</h3>
                <div class="detail-item">
                    <span>日历类型:</span>
                    <span id="birthdayCalendarType">-</span>
                </div>
                <div class="detail-item">
                    <span>生日日期:</span>
                    <span id="birthdayDate">-</span>
                </div>
                <div class="detail-item">
                    <span>关系:</span>
                    <span id="birthdayRelation">-</span>
                </div>
                <div class="detail-item">
                    <span>距离生日还有:</span>
                    <span id="daysUntil" style="color: #3b82f6; font-weight: 600;">-</span>
                </div>
            </div>
            
            <div class="detail-card">
                <h3 class="section-title">备注</h3>
                <div id="birthdayNotes" style="padding: 16px; background: #f9fafb; border-radius: 8px; color: #374151; line-height: 1.6;">-</div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">返回</button>
                <button class="btn btn-primary" onclick="editBirthday()">修改信息</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        let currentIndex = -1;
        let currentBirthday = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            currentIndex = parseInt(getUrlParam('id'));
            if (isNaN(currentIndex)) {
                alert('无效的生日记录ID');
                navigateTo('birthday.html');
                return;
            }
            
            const birthdays = getBirthdays();
            if (currentIndex >= birthdays.length) {
                alert('生日记录不存在');
                navigateTo('birthday.html');
                return;
            }
            
            currentBirthday = birthdays[currentIndex];
            loadBirthdayDetail();
        });

        function loadBirthdayDetail() {
            document.getElementById('birthdayName').textContent = currentBirthday.name;
            document.getElementById('birthdayCalendarType').textContent = currentBirthday.calendarType === 'lunar' ? '农历' : '公历';
            document.getElementById('birthdayDate').textContent = formatDate(currentBirthday.date);
            document.getElementById('birthdayRelation').textContent = currentBirthday.relation || '未设置';
            document.getElementById('daysUntil').textContent = `${getDaysUntilBirthday(currentBirthday.date)}天`;
            document.getElementById('birthdayNotes').textContent = currentBirthday.notes || '无备注';
        }

        function goBack() {
            navigateTo('birthday.html');
        }

        function editBirthday() {
            navigateTo(`birthday-edit.html?id=${currentIndex}`);
        }
    </script>
</body>
</html>
