<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 修改待办事项</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>修改待办事项</h1>
            <p>编辑您的任务信息</p>
        </div>
        
        <div class="form-container">
            <div class="form-header">
                <h1>修改待办事项</h1>
                <p>编辑任务信息</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">任务标题 *</label>
                <input type="text" id="todoTitle" class="form-input" placeholder="例如：完成项目报告">
            </div>
            
            <div class="form-group">
                <label class="form-label">起始时间</label>
                <input type="date" id="todoStartDate" class="form-input date-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">截止日期 *</label>
                <input type="date" id="todoDueDate" class="form-input date-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">优先级</label>
                <select id="todoPriority" class="form-input">
                    <option value="low">低优先级</option>
                    <option value="medium">中优先级</option>
                    <option value="high">高优先级</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">任务状态</label>
                <select id="todoStatus" class="form-input">
                    <option value="pending">未完成</option>
                    <option value="completed">已完成</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">任务描述</label>
                <textarea id="todoDescription" class="form-input" rows="4" placeholder="请输入任务详细描述..."></textarea>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        let currentIndex = -1;
        let currentTodo = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            currentIndex = parseInt(getUrlParam('id'));
            if (isNaN(currentIndex)) {
                alert('无效的待办事项ID');
                navigateTo('todo.html');
                return;
            }
            
            const todos = getTodos();
            if (currentIndex >= todos.length) {
                alert('待办事项不存在');
                navigateTo('todo.html');
                return;
            }
            
            currentTodo = todos[currentIndex];
            loadTodoData();
        });

        function loadTodoData() {
            document.getElementById('todoTitle').value = currentTodo.title;
            document.getElementById('todoStartDate').value = currentTodo.startDate || '';
            document.getElementById('todoDueDate').value = currentTodo.dueDate;
            document.getElementById('todoPriority').value = currentTodo.priority;
            document.getElementById('todoStatus').value = currentTodo.completed ? 'completed' : 'pending';
            document.getElementById('todoDescription').value = currentTodo.description || '';
        }

        function goBack() {
            navigateTo('todo-detail.html?id=' + currentIndex);
        }

        function saveEdit() {
            const title = document.getElementById('todoTitle').value.trim();
            const startDate = document.getElementById('todoStartDate').value;
            const dueDate = document.getElementById('todoDueDate').value;
            const priority = document.getElementById('todoPriority').value;
            const status = document.getElementById('todoStatus').value;
            const description = document.getElementById('todoDescription').value.trim();
            
            if (!title) {
                alert('请输入任务标题');
                return;
            }
            
            if (!dueDate) {
                alert('请选择截止日期');
                return;
            }
            
            const todos = getTodos();
            todos[currentIndex] = {
                title: title,
                startDate: startDate,
                dueDate: dueDate,
                priority: priority,
                description: description,
                createdAt: currentTodo.createdAt,
                completed: status === 'completed'
            };
            saveTodos(todos);
            
            showSuccessMessage();
            
            setTimeout(() => {
                navigateTo('todo.html');
            }, 1500);
        }
    </script>
</body>
</html>
