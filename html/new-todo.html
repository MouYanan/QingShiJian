<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 新建待办事项</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>新建待办事项</h1>
            <p>添加新的任务和提醒</p>
        </div>
        
        <div class="form-container">
            <div class="form-header">
                <h1>新建待办事项</h1>
                <p>添加新的任务</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">任务标题 *</label>
                <input type="text" id="todoTitle" class="form-input" placeholder="例如：完成项目报告">
            </div>
            
            <div class="form-group">
                <label class="form-label">起始时间</label>
                <input type="date" id="todoStartDate" class="form-input date-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">截止日期 *</label>
                <input type="date" id="todoDueDate" class="form-input date-input">
            </div>
            
            <div class="form-group">
                <label class="form-label">优先级</label>
                <select id="todoPriority" class="form-input">
                    <option value="low">低优先级</option>
                    <option value="medium" selected>中优先级</option>
                    <option value="high">高优先级</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">任务描述</label>
                <textarea id="todoDescription" class="form-input" rows="4" placeholder="请输入任务详细描述..."></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-checkbox">
                    <input type="checkbox" id="createCalendarEvent">
                    <span>创建手机日程提醒</span>
                </label>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">取消</button>
                <button class="btn btn-primary" onclick="saveTodo()">保存</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('todoDueDate').value = new Date().toISOString().split('T')[0];
        });

        function goBack() {
            navigateTo('todo.html');
        }

        function saveTodo() {
            const title = document.getElementById('todoTitle').value.trim();
            const startDate = document.getElementById('todoStartDate').value;
            const dueDate = document.getElementById('todoDueDate').value;
            const priority = document.getElementById('todoPriority').value;
            const description = document.getElementById('todoDescription').value.trim();
            const createCalendarEvent = document.getElementById('createCalendarEvent').checked;
            
            if (!title) {
                alert('请输入任务标题');
                return;
            }
            
            if (!dueDate) {
                alert('请选择截止日期');
                return;
            }
            
            const todos = getTodos();
            todos.push({
                title: title,
                startDate: startDate,
                dueDate: dueDate,
                priority: priority,
                description: description,
                createdAt: new Date().toISOString().split('T')[0],
                completed: false
            });
            saveTodos(todos);
            
            if (createCalendarEvent) {
                createCalendarReminder('待办事项', title, dueDate);
            }
            
            showSuccessMessage();
            
            setTimeout(() => {
                navigateTo('todo.html');
            }, 1500);
        }
    </script>
</body>
</html>
