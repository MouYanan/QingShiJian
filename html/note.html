<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <meta name="wap-font-scale" content="no">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="时笺">
    <title>时笺 - 笔记</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>笔记</h1>
            <p>记录您的想法和重要信息</p>
        </div>
        
        <div id="notesList">
            <div class="empty-state">
                <i class="fas fa-sticky-note"></i>
                <p>暂无笔记</p>
                <p class="text-sm">点击右下角+按钮创建新笔记</p>
            </div>
        </div>
    </div>

    <div class="circle-container">
        <div id="circleOptions"></div>
        <div id="circleBtn" class="circle-btn">
            <i class="fa fa-plus"></i>
        </div>
    </div>

    <footer>
        <nav class="bottom-box">
            <a href="index.html">
                <p class="fa fa-book"></p>
                <p>账单</p>
            </a>
            <a href="todo.html">
                <p class="fa fa-list"></p>
                <p>待办事项</p>
            </a>
            <a href="note.html" class="active">
                <p class="fa fa-pencil"></p>
                <p>笔记</p>
            </a>
            <a href="birthday.html">
                <p class="fa fa-birthday-cake"></p>
                <p>生日管家</p>
            </a>
            <a href="settings.html">
                <p class="fa fa-gear"></p>
                <p>设置</p>
            </a>
        </nav>
    </footer>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setActiveNavItem('note');
            loadNotes();
            initCircleButton([
                { text: '新建笔记', icon: 'fas fa-plus', color: 'purple', action: () => navigateTo('new-note.html') }
            ]);
        });

        function loadNotes() {
            const notes = getNotes();
            const container = document.getElementById('notesList');
            
            if (notes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-sticky-note"></i>
                        <p>暂无笔记</p>
                        <p class="text-sm">点击右下角+按钮创建新笔记</p>
                    </div>
                `;
                return;
            }
            
            const sortedNotes = sortByDate(notes, 'createdAt', true);
            
            let html = '';
            sortedNotes.forEach((note, index) => {
                html += `
                    <div class="note-item">
                        <div onclick="navigateTo('note-detail.html?id=${index}')">
                            <div class="note-title">${note.title}</div>
                            <div class="note-content">${note.content}</div>
                            <div class="note-date">创建于: ${formatDate(note.createdAt)}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteNote(${index}); event.stopPropagation();">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function deleteNote(index) {
            if (confirm('确定要删除这条笔记吗？')) {
                const notes = getNotes();
                const sortedNotes = sortByDate(notes, 'createdAt', true);
                // 找到原始数组中的索引
                const originalIndex = notes.findIndex(n => n.createdAt === sortedNotes[index].createdAt);
                if (originalIndex !== -1) {
                    notes.splice(originalIndex, 1);
                    saveNotes(notes);
                    showSuccessMessage();
                    setTimeout(() => {
                        loadNotes();
                    }, 1000);
                }
            }
        }
    </script>
</body>
</html>
