<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="renderer" content="webkit">
    <meta name="wap-font-scale" content="no">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="时笺">
    <title>时笺 - 账单</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>我的账单</h1>
            <p>管理您的日常支出和项目费用</p>
        </div>
        
        <div id="billsList">
            <div class="empty-state">
                <i class="fas fa-receipt"></i>
                <p>暂无账单记录</p>
                <p class="text-sm">点击右下角+按钮创建新账单</p>
            </div>
        </div>
    </div>

    <div class="circle-container">
        <div id="circleOptions"></div>
        <div id="circleBtn" class="circle-btn">
            <i class="fa fa-plus"></i>
        </div>
    </div>

    <footer>
        <nav class="bottom-box">
            <a href="index.html" class="active">
                <p class="fa fa-book"></p>
                <p>账单</p>
            </a>
            <a href="todo.html">
                <p class="fa fa-list"></p>
                <p>待办事项</p>
            </a>
            <a href="note.html">
                <p class="fa fa-pencil"></p>
                <p>笔记</p>
            </a>
            <a href="birthday.html">
                <p class="fa fa-birthday-cake"></p>
                <p>生日管家</p>
            </a>
            <a href="settings.html">
                <p class="fa fa-gear"></p>
                <p>设置</p>
            </a>
        </nav>
    </footer>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setActiveNavItem('index');
            loadBills();
            initCircleButton([
                { text: '项目账单', icon: 'fas fa-project-diagram', color: 'green', action: () => navigateTo('project-bill.html') },
                { text: '时间账单', icon: 'fas fa-clock', color: 'yellow', action: () => navigateTo('bookkeeping.html') }
            ]);
        });

        function loadBills() {
            const bills = getBills();
            const container = document.getElementById('billsList');
            
            if (bills.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-receipt"></i>
                        <p>暂无账单记录</p>
                        <p class="text-sm">点击右下角+按钮创建新账单</p>
                    </div>
                `;
                return;
            }
            
            const sortedBills = sortByDate(bills, 'createdAt', true);
            
            let html = '';
            sortedBills.forEach((bill, index) => {
                if (bill.type === 'project') {
                    html += `
                        <div class="bill-item">
                            <div onclick="navigateTo('bill-detail.html?id=${index}')">
                                <div class="bill-date">
                                    <i class="fas fa-project-diagram icon-green"></i>
                                    项目: ${bill.name}
                                </div>
                                <div class="bill-total">${formatCurrency(bill.total)}</div>
                                <div class="bill-items">
                                    ${bill.expenses.slice(0, 3).map(expense => `
                                     <div class="bill-item-detail">
                                         <div style="display: flex; flex-direction: column;">
                                             <span style="font-size: 12px; color: #6b7280;">${expense.date}</span>
                                             <span>${expense.item}</span>
                                         </div>
                                         <span>${formatCurrency(expense.amount)}</span>
                                     </div>
                                    `).join('')}
                                    ${bill.expenses.length > 3 ? `<div class="text-sm" style="color: #9ca3af; margin-top: 8px;">还有${bill.expenses.length - 3}项更多内容...</div>` : ''}
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteBill(${index}); event.stopPropagation();">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="bill-item">
                            <div onclick="navigateTo('bill-detail.html?id=${index}')">
                                <div class="bill-date">
                                    <i class="fas fa-clock icon-yellow"></i>
                                    ${formatDate(bill.date)}
                                </div>
                                <div class="bill-total">${formatCurrency(bill.total)}</div>
                                <div class="bill-items">
                                    ${bill.expenses.slice(0, 3).map(expense => `
                                        <div class="bill-item-detail">
                                            <span>${expense.item}</span>
                                            <span>${formatCurrency(expense.amount)}</span>
                                        </div>
                                    `).join('')}
                                    ${bill.expenses.length > 3 ? `<div class="text-sm" style="color: #9ca3af; margin-top: 8px;">还有${bill.expenses.length - 3}项更多内容...</div>` : ''}
                                </div>
                            </div>
                            <button class="delete-btn" onclick="deleteBill(${index}); event.stopPropagation();">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
        }
        
        function deleteBill(index) {
            if (confirm('确定要删除这条账单记录吗？')) {
                const bills = getBills();
                const sortedBills = sortByDate(bills, 'createdAt', true);
                // 找到原始数组中的索引
                const originalIndex = bills.findIndex(b => b.createdAt === sortedBills[index].createdAt);
                if (originalIndex !== -1) {
                    bills.splice(originalIndex, 1);
                    saveBills(bills);
                    showSuccessMessage();
                    setTimeout(() => {
                        loadBills();
                    }, 1000);
                }
            }
        }
    </script>
</body>
</html>
