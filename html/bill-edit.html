<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时笺 - 修改账单</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">时笺</a>
        </div>
    </nav>

    <div class="container" style="padding-top: 80px; padding-bottom: 100px;">
        <div class="page-header">
            <h1>修改账单</h1>
            <p>编辑您的账单信息</p>
        </div>
        
        <div class="form-container">
            <div class="form-header">
                <h1>修改账单</h1>
                <p id="editTypeLabel">编辑账单</p>
            </div>
            
            <div id="projectEditSection" style="display: none;">
                <div class="form-group">
                    <label class="form-label">项目名称</label>
                    <input type="text" id="projectName" class="form-input">
                </div>
                
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th style="width: 62%;">时间/事项</th>
                            <th style="width: 33%;">金额</th>
                            <th style="width: 5%;"></th>
                        </tr>
                    </thead>
                    <tbody id="projectTableBody"></tbody>
                </table>
                
                <button class="btn btn-secondary" style="width: 100%; margin-bottom: 16px;" onclick="addProjectRow()">
                    <i class="fas fa-plus" style="margin-right: 6px;"></i>添加行
                </button>
                
                <div class="total-section">
                    <span>总金额:</span>
                    <span id="projectTotal">¥0.00</span>
                </div>
            </div>
            
            <div id="timeEditSection" style="display: none;">
                <div class="date-display">
                    <h3>账单日期</h3>
                    <p id="dateDisplay">2024年1月1日</p>
                </div>
                
                <table class="expense-table">
                    <thead>
                        <tr>
                            <th style="width: 47%;">项目</th>
                            <th style="width: 38%;">金额</th>
                            <th style="width: 15%;"></th>
                        </tr>
                    </thead>
                    <tbody id="timeTableBody"></tbody>
                </table>
                
                <button class="btn btn-secondary" style="width: 100%; margin-bottom: 16px;" onclick="addTimeRow()">
                    <i class="fas fa-plus" style="margin-right: 6px;"></i>添加行
                </button>
                
                <div class="total-section">
                    <span>总金额:</span>
                    <span id="timeTotal">¥0.00</span>
                </div>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="goBack()">取消</button>
                <button class="btn btn-primary" onclick="saveEdit()">保存修改</button>
            </div>
        </div>
    </div>

    <div class="success-message" id="successMessage">保存成功！</div>

    <script src="js/app.js"></script>
    <script>
        let currentIndex = -1;
        let currentBill = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            currentIndex = parseInt(getUrlParam('id'));
            if (isNaN(currentIndex)) {
                alert('无效的账单ID');
                navigateTo('index.html');
                return;
            }
            
            const bills = getBills();
            if (currentIndex >= bills.length) {
                alert('账单不存在');
                navigateTo('index.html');
                return;
            }
            
            currentBill = bills[currentIndex];
            loadEditForm();
        });

        function loadEditForm() {
            if (currentBill.type === 'project') {
                document.getElementById('projectEditSection').style.display = 'block';
                document.getElementById('timeEditSection').style.display = 'none';
                document.getElementById('projectName').value = currentBill.name;
                loadProjectTable();
            } else {
                document.getElementById('projectEditSection').style.display = 'none';
                document.getElementById('timeEditSection').style.display = 'block';
                document.getElementById('dateDisplay').textContent = formatDate(currentBill.date);
                loadTimeTable();
            }
        }

        function loadProjectTable() {
            const tbody = document.getElementById('projectTableBody');
            tbody.innerHTML = '';
            currentBill.expenses.forEach(expense => {
                addProjectRow(expense);
            });
            calculateProjectTotal();
        }

        function loadTimeTable() {
            const tbody = document.getElementById('timeTableBody');
            tbody.innerHTML = '';
            currentBill.expenses.forEach(expense => {
                addTimeRow(expense);
            });
            calculateTimeTotal();
        }

        function addProjectRow(data = null) {
            const tbody = document.getElementById('projectTableBody');
            const today = new Date().toISOString().split('T')[0];
            const date = data ? data.date : today;
            const item = data ? data.item : '';
            const amount = data ? data.amount : '';
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <input type="date" class="form-input date-input" value="${date}" style="margin-bottom: 8px;">
                    <input type="text" class="form-input" value="${item}" placeholder="事项">
                </td>
                <td><input type="number" step="0.01" class="form-input" value="${amount}" onchange="calculateProjectTotal()"></td>
                <td><button class="btn btn-danger" onclick="removeProjectRow(this)">×</button></td>
            `;
            tbody.appendChild(row);
        }

        function addTimeRow(data = null) {
            const tbody = document.getElementById('timeTableBody');
            const item = data ? data.item : '';
            const amount = data ? data.amount : '';
            
            const row = document.createElement('tr');
            row.innerHTML = `
                <td><input type="text" class="form-input" value="${item}" placeholder="项目"></td>
                <td><input type="number" step="0.01" class="form-input" value="${amount}" onchange="calculateTimeTotal()"></td>
                <td><button class="btn btn-danger" onclick="removeTimeRow(this)">×</button></td>
            `;
            tbody.appendChild(row);
        }

        function removeProjectRow(button) {
            const row = button.closest('tr');
            const tbody = document.getElementById('projectTableBody');
            if (tbody.querySelectorAll('tr').length > 1) {
                row.remove();
                calculateProjectTotal();
            }
        }

        function removeTimeRow(button) {
            const row = button.closest('tr');
            const tbody = document.getElementById('timeTableBody');
            if (tbody.querySelectorAll('tr').length > 1) {
                row.remove();
                calculateTimeTotal();
            }
        }

        function calculateProjectTotal() {
            const inputs = document.querySelectorAll('#projectTableBody input[type="number"]');
            let total = 0;
            inputs.forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            document.getElementById('projectTotal').textContent = formatCurrency(total);
        }

        function calculateTimeTotal() {
            const inputs = document.querySelectorAll('#timeTableBody input[type="number"]');
            let total = 0;
            inputs.forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            document.getElementById('timeTotal').textContent = formatCurrency(total);
        }

        function goBack() {
            navigateTo('bill-detail.html?id=' + currentIndex);
        }

        function saveEdit() {
            const bills = getBills();
            
            if (currentBill.type === 'project') {
                const projectName = document.getElementById('projectName').value.trim();
                if (!projectName) {
                    alert('请输入项目名称');
                    return;
                }
                
                const expenses = [];
                const rows = document.querySelectorAll('#projectTableBody tr');
                
                rows.forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs[0].value && inputs[1].value.trim() && inputs[2].value) {
                        expenses.push({
                            date: inputs[0].value,
                            item: inputs[1].value.trim(),
                            amount: parseFloat(inputs[2].value)
                        });
                    }
                });
                
                if (expenses.length === 0) {
                    alert('请至少填写一个支出项目');
                    return;
                }
                
                const total = parseFloat(document.getElementById('projectTotal').textContent.replace('¥', ''));
                
                bills[currentIndex] = {
                    type: 'project',
                    name: projectName,
                    expenses: expenses,
                    total: total,
                    createdAt: currentBill.createdAt
                };
            } else {
                const expenses = [];
                const rows = document.querySelectorAll('#timeTableBody tr');
                
                rows.forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    if (inputs[0].value.trim() && inputs[1].value) {
                        expenses.push({
                            item: inputs[0].value.trim(),
                            amount: parseFloat(inputs[1].value)
                        });
                    }
                });
                
                if (expenses.length === 0) {
                    alert('请至少填写一个支出项目');
                    return;
                }
                
                const total = parseFloat(document.getElementById('timeTotal').textContent.replace('¥', ''));
                
                bills[currentIndex] = {
                    type: 'time',
                    date: currentBill.date,
                    expenses: expenses,
                    total: total,
                    createdAt: currentBill.createdAt
                };
            }
            
            saveBills(bills);
            showSuccessMessage();
            
            setTimeout(() => {
                navigateTo('index.html');
            }, 1500);
        }
    </script>
</body>
</html>
