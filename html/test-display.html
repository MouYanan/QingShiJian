<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试显示</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .test-item {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        .detail-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>测试时间与事项显示</h1>
        
        <div class="test-item">
            <h3>修改前（左右显示）：</h3>
            <div class="detail-item">
                <span>2024-01-15 - 购买材料</span>
                <span style="font-weight: 600;">¥500.00</span>
            </div>
        </div>
        
        <div class="test-item">
            <h3>修改后（上下显示）：</h3>
            <div class="detail-item">
                <div style="display: flex; flex-direction: column;">
                    <span style="font-size: 12px; color: #6b7280;">2024-01-15</span>
                    <span>购买材料</span>
                </div>
                <span style="font-weight: 600;">¥500.00</span>
            </div>
        </div>
        
        <div class="test-item">
            <h3>普通账单（不变）：</h3>
            <div class="detail-item">
                <span>餐饮费用</span>
                <span style="font-weight: 600;">¥120.00</span>
            </div>
        </div>
    </div>
</body>
</html>
